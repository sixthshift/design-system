name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Neither job writes anything; don't inherit the repo default token scope.
permissions:
  contents: read

env:
  # Match the devcontainer's pin (.devcontainer/Dockerfile) so CI and local dev
  # can't diverge on a Bun release. --frozen-lockfile does not protect against
  # resolver behaviour changes.
  BUN_VERSION: "1.3.9"

jobs:
  check:
    name: Tests and checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # setup-bun caches only the Bun binary, not the dependency store.
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # postinstall runs `bun run build`, which produces dist/theme.generated.css
      # and dist/styles.css — so there is no separate build step below.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Lint and format
        run: bun run check

      - name: Tests
        run: bun run test

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # Keyed on the lockfile so a playwright bump invalidates the browser cache
      # instead of restoring a revision that would just be re-downloaded.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      # 544 story smoke + a11y tests. Requires optimizeDeps.include for the
      # React runtime (see vitest.config.ts) — without it Vite re-optimizes
      # mid-run, reloads, and every render throws on a null React dispatcher.
      - name: Story tests
        run: bun run test:stories

      # Baselines are keyed by browser-platform-arch, so this job compares
      # against *-chromium-linux-x64.png. A developer's arm64 devcontainer
      # produces *-chromium-linux-arm64.png; the two never collide.
      #
      # SEEDING: the first run of this job has no x64 baselines and will fail,
      # writing them instead. Download the visual-baselines artifact below,
      # commit the PNGs, and the job goes green.
      - name: Visual regression
        run: bun run test:visual

      - name: Upload diffs and new baselines
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: |
            .vitest-attachments/
            src/**/__screenshots__/
          if-no-files-found: ignore
