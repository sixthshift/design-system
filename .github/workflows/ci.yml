name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Neither job writes anything; don't inherit the repo default token scope.
permissions:
  contents: read

env:
  # Match the devcontainer's pin (.devcontainer/Dockerfile) so CI and local dev
  # can't diverge on a Bun release. --frozen-lockfile does not protect against
  # resolver behaviour changes.
  BUN_VERSION: "1.3.9"

jobs:
  check:
    name: Tests and checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # setup-bun caches only the Bun binary, not the dependency store.
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      # the `prepare` script runs `bun run build`, producing dist/theme.generated.css
      # and dist/styles.css — so there is no separate build step below.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Lint and format
        run: bun run check

      - name: Tests
        run: bun run test

  browser:
    name: Browser tests
    # arm64 to match the devcontainer (.devcontainer/Dockerfile runs on aarch64).
    # Screenshot baselines are keyed by browser-platform-arch, and the rendering
    # stack is arch-specific — Playwright ships a separate Chromium build per
    # arch and its software rasteriser JITs to native code. Matching the arch
    # means the committed baselines are the ones checked here, so they can be
    # regenerated locally with `bun run test:visual:update` and CI will agree.
    # Free for public repositories.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      # Keyed on the lockfile so a playwright bump invalidates the browser cache
      # instead of restoring a revision that would just be re-downloaded.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: playwright-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      # 544 story smoke + a11y tests. Requires optimizeDeps.include for the
      # React runtime (see vitest.config.ts) — without it Vite re-optimizes
      # mid-run, reloads, and every render throws on a null React dispatcher.
      - name: Story tests
        run: bun run test:stories

      # Compares against the committed *-chromium-linux-arm64.png baselines.
      # The arch is still part of the path so an x64 contributor generates their
      # own set rather than overwriting these — vitest's default path template
      # ends in process.platform, which is just "linux" on both.
      - name: Visual regression
        run: bun run test:visual

      - name: Upload diffs and new baselines
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            .vitest-attachments/
            src/**/__screenshots__/
          if-no-files-found: ignore
