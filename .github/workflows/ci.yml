name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Neither job writes anything; don't inherit the repo default token scope.
permissions:
  contents: read

env:
  # Match the devcontainer's pin (.devcontainer/Dockerfile) so CI and local dev
  # can't diverge on a Bun release. --frozen-lockfile does not protect against
  # resolver behaviour changes.
  BUN_VERSION: "1.3.9"

jobs:
  check:
    name: Tests and checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # setup-bun caches only the Bun binary, not the dependency store.
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      # the `prepare` script runs `bun run build`, which compiles dist/ — so
      # there is no separate build step below.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Lint and format
        run: bun run check

      # Over the packed tarball, so it sees what npm will serve rather than the
      # working tree. dist/ already exists — `bun install` runs `prepare`.
      - name: Validate the published package
        run: bun run check:published

      # Type-checks a consumer under every moduleResolution the README makes a
      # promise about, including the one it documents as broken.
      - name: Consumer resolution
        run: bun run check:consumer-resolution

      # Diffs the committed public API surface. Releases are unattended, so a
      # rename filed as `refactor:` would ship a patch bump; this puts the change
      # in the pull request where a human can label it.
      - name: Public API surface
        run: bun run check:api

      # The same projects `bun run test` covers, with the coverage gate on top,
      # so the suite runs once rather than twice. Thresholds live in
      # vitest.config.ts.
      - name: Tests and coverage
        run: bun run test:coverage

  react-19:
    name: React 19 compatibility
    # The lockfile pins React 18, but peerDependencies advertise
    # "^18.2.0 || ^19.0.0". Without this job the React 19 half of that range is
    # never executed and would rot silently. Overlaying 19 on top of the frozen
    # install rewrites the lockfile inside the runner only — nothing is committed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Upgrade to React 19
        run: bun add -d react@^19 react-dom@^19 @types/react@^19 @types/react-dom@^19

      - name: Type check
        run: bun run type-check

      - name: Tests
        run: bun run test

  browser:
    name: Browser tests
    # Runs inside the dev container image, not on the bare runner.
    #
    # Screenshot baselines compare pixel-for-pixel. Matching the CPU
    # architecture was necessary but not sufficient: glyph hinting and
    # antialiasing come from freetype/fontconfig, which ship with the OS image,
    # and the runner is Ubuntu noble while the devcontainer is Debian bookworm.
    # The same pinned Chromium therefore drew text slightly differently — 523
    # pixels on one Card baseline, all of it letter edges.
    #
    # Chasing the runner image is a losing game: GitHub rebuilds it on their
    # schedule and it cannot be pinned. This image can be, so CI steps into it.
    # Published by .github/workflows/devcontainer-image.yml.
    #
    # TODO: replace :latest with the digest that workflow prints. A tag drifts,
    # which is the exact problem this is here to remove.
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/sixthshift/design-system-dev:latest
      # Works whether the package is public or private; GHCR packages are
      # private by default until published visibility is changed.
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # No setup-bun here: the image already carries the pinned Bun that the
      # devcontainer uses, and using it is the whole point of this job.
      - name: Verify the toolchain came from the image
        run: |
          echo "bun    $(bun --version)  (expected ${{ env.BUN_VERSION }})"
          echo "distro $(. /etc/os-release && echo "$PRETTY_NAME")"
          test "$(bun --version)" = "${{ env.BUN_VERSION }}"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      # Keyed on the lockfile so a playwright bump invalidates the browser cache
      # instead of restoring a revision that would just be re-downloaded.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: playwright-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The image already has Chromium's system libraries (see the Dockerfile),
      # so only the browser binary is fetched here.
      - name: Install Chromium
        run: bunx playwright install chromium

      # 544 story smoke + a11y tests. Requires optimizeDeps.include for the
      # React runtime (see vitest.config.ts) — without it Vite re-optimizes
      # mid-run, reloads, and every render throws on a null React dispatcher.
      - name: Story tests
        run: bun run test:stories

      # Compares against the committed *-chromium-linux-arm64.png baselines,
      # which are generated locally with `bun run test:visual:update`. Because
      # this job renders in the same image, those are the authoritative set —
      # CI only ever checks them, never writes them.
      - name: Visual regression
        run: bun run test:visual

      - name: Upload diffs and new baselines
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            .vitest-attachments/
            src/**/__screenshots__/
          if-no-files-found: ignore
