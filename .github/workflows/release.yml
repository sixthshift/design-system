# Publishes to npm once version.yml has tagged a release.
#
# Authentication is npm trusted publishing (OIDC): GitHub Actions mints a
# short-lived token for this single run and npm exchanges it against the trusted
# publisher configured on the package. There is no NPM_TOKEN — nothing to leak,
# nothing to rotate, and no 2FA prompt to get stuck behind in an unattended run.
# Provenance comes with it: npm records a signed, verifiable link from the
# tarball back to this workflow and the exact commit that produced it.
#
# npm authorises the *calling* workflow rather than the one containing the
# publish step, and allows exactly one trusted publisher per package. version.yml
# is therefore the sole entry point, and the publisher registered on npmjs.com
# must name `version.yml`. Do not add `push:` or `workflow_dispatch:` triggers
# here — that would make this file the top-level workflow for those runs, and the
# OIDC claim would no longer match the configuration, so npm would reject the
# publish. Manual releases go through version.yml's workflow_dispatch instead.
name: Release

on:
  workflow_call:
    inputs:
      ref:
        description: The tag to publish.
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Match the devcontainer's pin, as the other workflows do.
  BUN_VERSION: "1.3.9"

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token npm exchanges for publish rights and provenance. A
      # reusable workflow cannot hold more permission than the job calling it,
      # so version.yml has to grant this as well.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # Deliberately no `registry-url`. That input makes setup-node write
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} into .npmrc, and with
      # no token in the environment — the intended state here — it expands to an
      # empty value. npm reads the line as "credentials are configured", never
      # starts the OIDC exchange, and fails with ENEEDAUTH or a 404. The default
      # registry is already registry.npmjs.org, so the line buys nothing.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Trusted publishing requires npm >= 11.5.1. Node 24 ships an npm 11, but
      # the patch level rides along with whichever Node build the runner
      # resolves, so pin it here rather than inherit it.
      - name: Pin npm
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A tag that disagrees with the manifest publishes the wrong version under
      # the right name, which cannot be undone after 72 hours. Fail before that.
      - name: Verify the tag matches package.json
        run: |
          REF="${{ inputs.ref }}"
          TAG="${REF#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $REF does not match package.json version $PKG"
            exit 1
          fi

      # The browser and visual suites already ran on this commit via ci.yml.
      # These are the environment-independent gates, re-run here so nothing is
      # published that cannot pass them.
      - name: Type check
        run: bun run type-check

      - name: Lint and format
        run: bun run check

      - name: Tests
        run: bun run test

      # Shows the exact file list in the log, so a bad `files` allowlist is
      # visible in the release record rather than discovered by a consumer.
      - name: Pack preview
        run: npm pack --dry-run

      # No --provenance: trusted publishing generates and publishes the
      # attestation on its own, and no NODE_AUTH_TOKEN, which would suppress the
      # OIDC exchange. publishConfig.access is already "public"; --access repeats
      # it so the intent is legible at the call site.
      - name: Publish
        run: npm publish --access public

      - name: Summary
        run: |
          echo "### Published \`$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "https://www.npmjs.com/package/$(node -p "require('./package.json').name")" >> "$GITHUB_STEP_SUMMARY"
