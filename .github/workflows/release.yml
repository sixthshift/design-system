# Publishes to npm when a v* tag is pushed.
#
# Publishing from CI rather than a laptop is what makes provenance possible:
# npm records a signed, verifiable link from the tarball back to this workflow
# and the exact commit that produced it. That attestation cannot be generated
# locally, and it shows on the package page.
name: Release

on:
  # A human pushing a tag by hand.
  push:
    tags: ["v*"]
  # The automatic path: version.yml calls this after it has written the bump
  # commit and tag. A tag pushed with GITHUB_TOKEN deliberately does not trigger
  # workflows, so the tag trigger above would never fire for it — calling this
  # workflow directly is what avoids needing a personal access token.
  workflow_call:
    inputs:
      ref:
        description: The tag to publish.
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Match the devcontainer's pin, as the other workflows do.
  BUN_VERSION: "1.3.9"

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for provenance — this is the OIDC token npm exchanges to prove
      # where the build came from.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # setup-node provides the registry auth wiring that NODE_AUTH_TOKEN feeds,
      # and an npm new enough to support --provenance.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A tag that disagrees with the manifest publishes the wrong version under
      # the right name, which cannot be undone after 72 hours. Fail before that.
      - name: Verify the tag matches package.json
        run: |
          REF="${{ inputs.ref || github.ref_name }}"
          TAG="${REF#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $REF does not match package.json version $PKG"
            exit 1
          fi

      # The browser and visual suites already ran on this commit via ci.yml.
      # These are the environment-independent gates, re-run here so nothing is
      # published that cannot pass them.
      - name: Type check
        run: bun run type-check

      - name: Lint and format
        run: bun run check

      - name: Tests
        run: bun run test

      # Shows the exact file list in the log, so a bad `files` allowlist is
      # visible in the release record rather than discovered by a consumer.
      - name: Pack preview
        run: npm pack --dry-run

      # publishConfig.access is already "public"; --access is repeated here so
      # the intent is legible at the call site.
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          echo "### Published \`$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "https://www.npmjs.com/package/$(node -p "require('./package.json').name")" >> "$GITHUB_STEP_SUMMARY"
