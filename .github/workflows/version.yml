# Derives the next version from Conventional Commits after CI passes on main,
# commits the bump, tags it, and hands off to the release workflow.
#
# Triggered by workflow_run rather than push so it only ever runs on a commit
# that already went green — versioning a broken main would publish it.
#
# This is also the only entry point to release.yml. npm's trusted publishing
# authorises the calling workflow, not the one holding the publish step, and
# permits one publisher per package — so the publisher registered on npmjs.com
# names this file, and release.yml stays workflow_call-only.
name: Version

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

  # The retry path. Publishing happens after the bump commit and tag are already
  # pushed, so a failure there (a registry outage, an auth misconfiguration)
  # leaves a version tagged but unpublished — and nothing could re-enter the
  # publish, because this workflow only ever derives *new* versions and
  # release.yml cannot be triggered directly without invalidating the OIDC claim.
  # Dispatching an existing tag here runs the publish against it and nothing else.
  workflow_dispatch:
    inputs:
      tag:
        description: An existing v* tag to publish, e.g. v0.2.0.
        required: true
        type: string

concurrency:
  group: version
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.9"

jobs:
  bump:
    name: Derive and tag
    # workflow_run also fires for pull requests and for failed runs. The last
    # clause is a second net under [skip ci] below: if CI ever does run on the
    # bot's own bump commit, this still refuses to version it again. A manual
    # dispatch skips this job outright — it publishes a tag that already exists
    # and must not derive or move a version.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.derive.outputs.released }}
      version: ${{ steps.derive.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI actually validated, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha }}
          # Full history and tags: the derivation walks commits since the last v* tag.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # scripts/next-version.ts is unit-tested (scripts/next-version.test.ts).
      # feat -> minor, `!` or a BREAKING CHANGE footer -> breaking, and every
      # other type -> patch, including an unconventional subject; only
      # chore/ci/docs/test/style release nothing. Below 1.0.0 a breaking change
      # moves the minor rather than declaring 1.0.0. The reference point is the
      # last v* tag, not package.json, so a hand-edited manifest cannot skip or
      # replay a version.
      #
      # Assigned before it is echoed, deliberately: inside `echo "$(...)"` the
      # exit status would belong to echo, so a crashing script would read as
      # "nothing to release" and skip the release silently.
      - name: Derive the next version
        id: derive
        run: |
          NEXT="$(bun run scripts/next-version.ts)"
          if [ -z "$NEXT" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No releasable commits since the last tag — nothing to publish." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next version: \`v$NEXT\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and tag
        if: steps.derive.outputs.released == 'true'
        run: |
          VERSION="${{ steps.derive.outputs.version }}"

          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.argv[1];
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          " "$VERSION"

          # Keep the manifest formatted the way the repo's formatter expects, so
          # the next run's `biome check` does not trip over the bot's commit.
          # Pinned: this job never runs `bun install`, so a bare `bunx biome`
          # would fetch whatever is current and could format to a different
          # standard than the one `bun run check` enforces.
          bunx @biomejs/biome@2.4.15 format --write package.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          # The first release derives the version package.json already declares,
          # so there is nothing to commit and `git commit` would exit 1 and take
          # the release down with it. Tag the validated commit as it stands
          # instead — which is also the commit provenance will attest to.
          if git diff --cached --quiet; then
            echo "package.json already declares $VERSION — tagging without a bump commit."
          else
            # [skip ci] keeps CI from running on the bot's own commit, which would
            # trigger this workflow again and loop forever.
            git commit -m "chore(release): v$VERSION [skip ci]"
          fi
          git tag "v$VERSION"
          # A no-op when nothing was committed: "Everything up-to-date", exit 0.
          git push origin HEAD:main
          git push origin "v$VERSION"

  publish:
    name: Publish
    needs: bump
    # A manual dispatch skips `bump`, and a skipped dependency would normally
    # cascade and skip this job too — hence !cancelled() rather than resting on
    # the needs result alone. A *failed* bump still stops here: on the
    # workflow_run path `released` is empty, and the dispatch clause is false.
    if: >-
      !cancelled() &&
      (needs.bump.outputs.released == 'true' || github.event_name == 'workflow_dispatch')
    # A reusable workflow cannot hold more permission than the job calling it, so
    # id-token must be granted here or the OIDC exchange inside release.yml has
    # no token to present, and both auth and provenance fail with it.
    permissions:
      contents: read
      id-token: write
    # One publish definition, entered from both the automatic and manual paths,
    # rather than two that can drift apart.
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || format('v{0}', needs.bump.outputs.version) }}
